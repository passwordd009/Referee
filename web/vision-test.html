<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laugh Detector Test</title>
    <style>
      body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', monospace;
             display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
      h1 { font-size: 18px; letter-spacing: 3px; }
      video { width: min(480px, 90vw); border-radius: 8px; transform: scaleX(-1); background: #111; }
      #status { font-size: 14px; }
      .meter { width: min(480px, 90vw); height: 14px; background: #222; border-radius: 7px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: linear-gradient(90deg, #4ade80, #fbbf24, #ef4444);
              transition: width 0.1s linear; }
      #laugh { font-size: 22px; font-weight: 700; color: #ef4444; visibility: hidden; }
      .row { font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>LAUGH DETECTOR TEST</h1>
    <video id="preview" autoplay playsinline muted></video>
    <div id="status">starting camera…</div>
    <div class="meter"><div id="fill"></div></div>
    <div id="laugh">😂 LAUGH DETECTED</div>
    <p class="row">Smile at the camera — the meter should move and cross the line at a real smile.</p>
    <script type="module" src="/src/visionTest.ts"></script>
  </body>
</html>
